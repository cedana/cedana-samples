name: Publish

permissions:
  contents: write
  packages: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      github:
        type: boolean
        description: "Publish to GitHub releases"
        required: false
        default: false
      dockerhub:
        type: boolean
        description: "Publish images to Docker Hub"
        required: false
        default: false
      post_summary:
        type: boolean
        description: "Post summary to Slack"
        required: false
        default: false
      image:
        type: boolean
        description: "Publish the Docker image (built by build.yml's image)"
        default: true
      image_supplementary:
        type: boolean
        description: "Publish the supplementary Docker images"
        default: true
      image_lite:
        type: boolean
        description: "Publish the lite image"
        default: true
      lite_cuda_versions:
        type: string
        description: "CUDA versions of the lite image (JSON list)"
        default: '["12.2", "12.4", "12.8", "13.2"]'
      image_name:
        type: string
        description: "Name of the Docker image (build.yml's image_name)"
        default: cedana/cedana-samples

jobs:
  github:
    name: GitHub
    if: inputs.github
    runs-on: ubuntu-latest
    steps:
      - uses: runs-on/action@v1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          fetch-tags: true

      - name: Create release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.head_ref || github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="$tag" \
              --generate-notes

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.head_ref || github.ref_name }}
        run: |
          find kubernetes -type f -exec gh release upload --clobber "$tag" \
              --repo="$GITHUB_REPOSITORY" {} +

  dockerhub:
    name: DockerHub
    runs-on: ubuntu-latest
    if: ${{ inputs.dockerhub && inputs.image }}
    strategy:
      fail-fast: false
      matrix:
        cuda_version:
          - 12.2
          - 12.4
          - 12.8
          - 13.2
        torch_version:
          - "2.7"
          - "2.8"
          - "2.10"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.cuda_version }}-${{ matrix.torch_version }}-*
          merge-multiple: true

      - name: Download image name
        uses: actions/download-artifact@v4
        with:
          path: /tmp/image-name
          name: image-name
          merge-multiple: true

      - name: Check directories and set variables
        id: check_dirs
        run: echo "IMAGE_NAME=$(cat /tmp/image-name/name.txt)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.check_dirs.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=cuda${{ matrix.cuda_version }}-torch${{ matrix.torch_version }}
            type=raw,value=cuda${{ matrix.cuda_version }}-torch${{ matrix.torch_version }}-${{ github.head_ref || github.ref_name }}
            ${{ (matrix.cuda_version == '12.8' && matrix.torch_version == '2.7') && 'type=raw,value=cuda' || '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.check_dirs.outputs.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ steps.check_dirs.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # The lite image, by CUDA version and by commit: cedana's tests take a PR's
  # (or main's) at its commit, cuda<version>-lite-<sha>.
  dockerhub-lite:
    name: DockerHub (lite)
    runs-on: ubuntu-latest
    if: ${{ inputs.dockerhub && inputs.image_lite }}
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ${{ fromJSON(inputs.lite_cuda_versions) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-lite-${{ matrix.cuda_version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=cuda${{ matrix.cuda_version }}-lite
            type=raw,value=cuda${{ matrix.cuda_version }}-lite-${{ github.head_ref || github.ref_name }}
            type=raw,value=cuda${{ matrix.cuda_version }}-lite-${{ github.event.pull_request.head.sha || github.sha }}
            ${{ matrix.cuda_version == '12.8' && 'type=raw,value=cuda-lite' || '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.image_name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.image_name }}:${{ steps.meta.outputs.version }}

  dockerhub-supplementary:
    name: DockerHub
    runs-on: ubuntu-latest
    if: ${{ inputs.dockerhub && inputs.image_supplementary }}
    strategy:
      matrix:
        image:
          - compbio
          - cpu
      fail-fast: false
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Download image name
        uses: actions/download-artifact@v4
        with:
          path: /tmp/image-name
          name: image-name
          merge-multiple: true

      - name: Check directories and set variables
        id: check_dirs
        run: echo "IMAGE_NAME=$(cat /tmp/image-name/name.txt)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.check_dirs.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.image }}
            type=raw,value=${{ matrix.image }}-${{ github.head_ref || github.ref_name }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.check_dirs.outputs.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ steps.check_dirs.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  post-summary:
    name: Post Summary
    runs-on: ubuntu-latest
    needs: [dockerhub, dockerhub-lite, dockerhub-supplementary, github]
    if: inputs.post_summary
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          fetch-tags: true

      - name: Get tag
        id: tag
        run: |
          echo "tag=$(git tag --sort=-creatordate | sed -n '1p')" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: previous-tag
        run: |
          echo "tag=$(git tag --sort=-creatordate | sed -n '2p')" >> $GITHUB_OUTPUT

      - name: Post summary
        uses: cedana/cedana-publish-summary@v1
        with:
          title: cedana-samples
          tag: ${{ steps.tag.outputs.tag }}
          previous-tag: ${{ steps.previous-tag.outputs.tag }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_RELEASE }}
